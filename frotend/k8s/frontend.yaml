apiVersion: v1
kind: Service
metadata:
  name: asset-frontend
spec:
  selector:
    app: asset-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asset-frontend
  template:
    metadata:
      labels:
        app: asset-frontend
    spec:
      containers:
        - name: asset-frontend
          image: asset-frontend:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20