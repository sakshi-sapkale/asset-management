apiVersion: v1
kind: Secret
metadata:
  name: asset-api
type: Opaque
stringData:
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/asset_management
---
apiVersion: v1
kind: Service
metadata:
  name: asset-api
spec:
  selector:
    app: asset-api
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asset-api
  template:
    metadata:
      labels:
        app: asset-api
    spec:
      containers:
        - name: asset-api
          image: asset-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: asset-api
                  key: DATABASE_URL
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20